<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>template for mathematician</title>
    <!-- reveal.js@4.6.0 for chalkboard -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.css">
    <!-- please select your favorite theme from 
      https://cdn.jsdelivr.net/npm/reveal.js@latest/dist/theme/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@latest/dist/theme/black.css" id="theme">
    <!-- for Highlight -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/highlight/zenburn.css">
    <!-- for Chalkboard -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/customcontrols/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/style.css">
  </head>

  <body>
    <div class="reveal">
      <div class="slides">
	<section>
	  <h1>Template for mathematician</h1>
	</section>
	<section>
	  <h2>chalkboard test</h2>
	</section>
	<section>
	  <h2>$\KaTeX$ test</h2>
	</section>
	<section>
	  <h2>highlight test</h2>
	  <section>
	    <pre><code class="python" data-trim data-noescape>
		for i in range(10):
		print(i)
	    </code></pre>
	  </section>
	</section>
      </div>
    </div>

    <!-- reveal.js@4.6.0 for chalkboard-->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/math/math.js"></script>

    <!-- Font awesome is required for the chalkboard plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/customcontrols/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/plugin.js"></script>    

    <script>
      Reveal.initialize({
	  transition: 'concave',
	  controls: true,
	  progress: true,
	  history: true,
	  center: true,
	  customcontrols: {
	      controls: [
		  { icon: '<i class="fa fa-pen-square"></i>',
		    title: 'Toggle chalkboard (B)',
		    action: 'RevealChalkboard.toggleChalkboard();'
		  },
		  { icon: '<i class="fa fa-pen"></i>',
		    title: 'Toggle notes canvas (C)',
		    action: 'RevealChalkboard.toggleNotesCanvas();'
		  }
	      ]
	  },
	  chalkboard: {
	      // add configuration here
	  },
	  plugins: [ RevealHighlight, RevealNotes, RevealMath.KaTeX, RevealChalkboard, RevealCustomControls ],
      });
    </script>
  </body>
</html>
