    <!-- reveal.js and plugins -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.2/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/search/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/notes/notes.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/zoom/zoom.js"></script>

    <!-- Font awesome is required for the chalkboard plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/customcontrols/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/plugin.js"></script>    

    <script>
      Reveal.initialize({
	  /* Available transition styles: none, fade, slide, convex, concave, zoom
	       cf.) https://revealjs.com/transitions/ */
	  transition: 'concave', 
	  controls: true,
	  progress: true,
	  history: true,
	  center: true,
	  /* c/t : Flattened slide number / total slides
	       cf.) https://revealjs.com/slide-numbers/ */
	  // slideNumber: 'c/t'
	  customcontrols: {
	      controls: [
		  { icon: '<i class="fa fa-pen-square"></i>',
		    title: 'Toggle chalkboard (B)',
		    action: 'RevealChalkboard.toggleChalkboard();'
		  },
		  { icon: '<i class="fa fa-pen"></i>',
		    title: 'Toggle notes canvas (C)',
		    action: 'RevealChalkboard.toggleNotesCanvas();'
		  }
	      ]
	  },
	  chalkboard: {
	      /* add configuration here */
	  },
	  plugins: [ RevealHighlight,
		     RevealSearch,
		     RevealNotes,
		     RevealMath.KaTeX,
		     RevealZoom, 
		     RevealChalkboard, RevealCustomControls ],
      });
      /* Separate Pages for Fragments
           cf.) https://revealjs.com/pdf-export/ */
      Reveal.configure({
	  pdfSeparateFragments: false
      });
    </script>
